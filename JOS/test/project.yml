---
# =============================================================================
# Ceedling project configuration - RedPill / JOS host unit tests
# =============================================================================
# Host-side (x86_64/aarch64 gcc) unit tests for the flight software modules
# that are pure logic or can be exercised against a faked HAL. The flight
# build itself is unchanged and still built with arm-none-eabi-gcc via
# ../Makefile.
#
# Unity/CMock come from the Ceedling *gem* (:which_ceedling: gem below).
# There is deliberately NO vendored copy of Unity in this repository: two
# Unity versions in one build produce silent ABI/macro mismatches.
#
# Two complementary doubling strategies live side by side (W2-6):
#   - hand-written fakes in fakes/ + support/ for the HAL/Flash/FRAM surface
#     (boot_crc, memory): the tests need a *behavioural* double (a real write
#     -> read round trip through an emulated Flash pool), not a call recorder;
#   - CMock mocks generated from fakes/cmsis_os.h, fakes/task.h and from the
#     App headers for the RTOS-facing modules (watchdog, comms): there the
#     question under test is "was this call made, with these arguments", which
#     is exactly what a mock answers and a fake cannot.
# The two must never overlap in one executable: a symbol defined by a file on
# the :support: path is linked into EVERY test binary, so its header must not
# also be mocked (see the note at the top of fakes/main.h).
#
# Run from JOS/test/:   ceedling test:all
# Or from JOS/:         make test
#
# Refs: ECSS-E-ST-40C 5.5 (software validation), NASA-STD-8739.8 (unit test
#       evidence), JPL-182 Rule 31 (all code exercised by tests).
# =============================================================================

:project:
  :which_ceedling: gem          # use the installed gem's Unity/CMock, never a vendored copy
  :use_exceptions: FALSE
  :use_test_preprocessor: :none # headers are plain C; no macro expansion needed
  :use_backtrace: :simple
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
  # Only modules that are host-compilable are on the source path. In
  # particular ../Core/Src is NOT: it is CubeMX-generated (main.c,
  # stm32l4xx_it.c, stm32l4xx_hal_msp.c, system_stm32l4xx.c, syscalls.c ...),
  # it pulls the whole HAL/CMSIS/FreeRTOS tree, and Ceedling would happily
  # feed main.c to the host gcc for any test that includes "main.h" (the test
  # build uses fakes/main.h instead). If a Core/Src module ever becomes
  # host-testable, add that one file explicitly under :files: :source: rather
  # than putting the whole directory back on the path.
  :source:
    - ../App/obsw
    - ../App/memory
    - ../App/comms
    - ../App/aocs
  :include:
    # fakes/ first: it shadows main.h, cmsis_os.h, cmsis_os2.h, FreeRTOS.h,
    # task.h and the Core/Inc headers the App modules pull in (sram2_parity.h,
    # dual_bank.h, hw_watchdog.h), none of which can be compiled for the host.
    # Any real header that reached the compiler first would drag in the whole
    # HAL/CMSIS/FreeRTOS tree.
    - fakes
    - ../App
    - ../App/obsw
    - ../App/memory
    - ../App/comms
    - ../App/aocs
    - support
  :support:
    - support

:defines:
  :test:
    :*:
      - HOST_UNIT_TEST
    # test_bad_region.c links the same boot_crc.c but with the fake linker
    # symbols laid out so that __fw_crc_start <= __fw_image_start, which is
    # the only way to reach the BOOT_CRC_BAD_REGION branch on the host.
    :test_bad_region:
      - HOST_FW_BAD_REGION
    # test_boot_unstamped_bench.c links the same boot_crc.c with the bench
    # opt-out of the unstamped-image policy, which is the only way to reach
    # the #if BOOT_CRC_TRUST_UNSTAMPED branch of boot_crc_image_trusted().
    # The flight default (0) is exercised by every other test executable.
    :test_boot_unstamped_bench:
      - BOOT_CRC_TRUST_UNSTAMPED=1

:flags:
  :test:
    :compile:
      :*:
        - -std=gnu11
        - -Wall
        - -Wextra
        - -Wno-unused-parameter
        - -Werror

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  # FALSE, not TRUE: the RTOS-facing tests (test_watchdog, test_comms) assert
  # on calls to several independent mocks at once (mock_cmsis_os +
  # mock_task + mock_state_machine). Global cross-mock ordering would then
  # encode the *interleaving* of mutex traffic, tick reads and dispatch calls
  # as part of the contract, which is an implementation detail: reordering two
  # lines inside watchdog_register_task() would break a test without changing
  # any observable behaviour. Ordering that genuinely matters is asserted
  # explicitly (e.g. the registration tick stamp preceding the liveness stamp).
  :enforce_strict_ordering: FALSE
  :plugins:
    - :ignore
    - :ignore_arg
    - :callback
    - :expect_any_args
    - :return_thru_ptr
  # CMock cannot infer a comparison for a typedef it has not seen expanded
  # (:use_test_preprocessor: :none), so the enum/scalar aliases used in the
  # mocked prototypes are mapped explicitly. Getting one wrong makes CMock
  # compare the wrong width and silently pass.
  :treat_as:
    HAL_StatusTypeDef: INT
    osStatus_t: INT
    osPriority_t: INT
    osKernelState_t: INT
    obw_state_t: INT
    comms_tc_result_t: INT
    TickType_t: UINT32

:plugins:
  :load_paths: []
  :enabled:
    # report_tests_pretty_stdout is what registers a failed test as a BUILD
    # FAILURE, which is what makes `ceedling test:all` exit non-zero. Listing
    # :enabled: replaces Ceedling's defaults wholesale, so leaving it out (as
    # this file first did) produced a run that printed "1 Failures" and still
    # exited 0 - a CI step that cannot fail. Verified by mutation: exit 1 with
    # a broken test, exit 0 clean.
    - report_tests_pretty_stdout
    - gcov

# =============================================================================
# Coverage
# =============================================================================
# `ceedling gcov:all` produces a real, enforced number: gcovr must be
# installed (CI installs it) and the run fails if line or branch coverage of
# the modules under test drops below the thresholds below. Reporting coverage
# without a threshold is a gate that cannot fail, which is worse than no gate
# because it looks like one.
:gcov:
  :summaries: TRUE
  :report_task: FALSE
  :utilities:
    - gcovr
  :reports:
    - Text
  :gcovr:
    :report_root: ".."
    :report_exclude: '^(test|build|Drivers|Middlewares|Core)[\\/]'
    :sort_percentage: TRUE
    :print_summary: TRUE
    # Without :exception_on_fail the plugin only prints a warning and still
    # exits 0, i.e. the threshold below would be decoration. TRUE turns a
    # coverage regression into a failed build.
    :exception_on_fail: TRUE
    :fail_under_line: 90
    :fail_under_branch: 75
