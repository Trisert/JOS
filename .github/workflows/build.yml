name: Build JOS firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis gate.
  #
  # SCOPE: first-party code ONLY -- `JOS/App` and the hand-written CubeMX
  # `JOS/Core/Src` sources. The vendored trees (`JOS/Drivers` = STM32 HAL +
  # CMSIS, `JOS/Middlewares` = FreeRTOS, `JOS/Core/Inc/RadioLib`) are NOT
  # analysed; they are only on the include path so first-party headers resolve,
  # and their findings are silenced with PATH-SCOPED suppressions so no check id
  # is ever disabled for code we own.
  #
  # SINGLE SOURCE OF TRUTH: every flag, include path, define, exclusion and
  # suppression lives in the `cppcheck` target of `JOS/Makefile`, derived from
  # the same $(INCLUDES)/$(C_DEFS) the compiler uses. This workflow only calls
  # `make`, so the gate cannot drift from the real build. Run
  # `make -C JOS cppcheck-print` to see the exact command.
  # ---------------------------------------------------------------------------
  static-analysis:
    # The runner image is PINNED (deliberately not `ubuntu-latest`): the
    # cppcheck finding set is version dependent, so an image refresh must not be
    # able to change the gate result behind our backs.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned cppcheck
        run: |
          sudo apt-get update
          # PINNED VERSION. ubuntu-24.04 (noble/universe) ships exactly
          # cppcheck 2.13.0-2ubuntu3. Pinning matters because a cppcheck bump
          # can add, drop or retune checks (e.g. `constParameter` was split into
          # `constParameterPointer` in 2.11+) and would silently change what
          # this gate accepts. If this install ever fails, the archive moved:
          # bump it here AND bump CPPCHECK_VERSION in JOS/Makefile in the same
          # PR, after re-running the gate and triaging any new findings.
          sudo apt-get install -y --no-install-recommends cppcheck=2.13.0-2ubuntu3
          cppcheck --version

      # Canary: proves the gate is still capable of failing BEFORE we trust a
      # green result on the real tree. It generates a throwaway C file with an
      # out-of-bounds array write and a NULL dereference, runs cppcheck over it
      # with the EXACT same flags as the real gate, deletes the file, and exits
      # non-zero if cppcheck came back clean.
      #
      # This is not theoretical: the first version of this gate suppressed
      # `preprocessorErrorDirective` and never defined `__GNUC__`, so
      # cmsis_compiler.h hit `#error Unknown compiler`, cppcheck abandoned the
      # configuration without analysing anything and exited 0 on every run. The
      # canary #includes main.h and FreeRTOS.h, so it walks the same
      # HAL/CMSIS/FreeRTOS-portable include chain and reproduces that failure
      # mode -- it is verified to go red under the old flags.
      - name: Canary (assert the cppcheck gate can fail)
        run: make -C JOS cppcheck-canary

      - name: Static analysis (cppcheck, first-party only)
        run: make -C JOS cppcheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Build firmware
        working-directory: JOS
        run: make all

      - name: Report size
        working-directory: JOS
        run: arm-none-eabi-size build/JOS.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jos-firmware
          path: |
            JOS/build/JOS.elf
            JOS/build/JOS.hex
            JOS/build/JOS.bin
          if-no-files-found: error
