name: Build JOS firmware

on:
  push:
    branches: [main]
  # No base-branch filter: every pull request is gated, including ones that are
  # stacked on another feature branch rather than targeting main directly.
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis gate.
  #
  # SCOPE: first-party code ONLY -- `JOS/App` and the hand-written CubeMX
  # `JOS/Core/Src` sources. The vendored trees (`JOS/Drivers` = STM32 HAL +
  # CMSIS, `JOS/Middlewares` = FreeRTOS, `JOS/Core/Inc/RadioLib`) are NOT
  # analysed; they are only on the include path so first-party headers resolve,
  # and their findings are silenced with PATH-SCOPED suppressions so no check id
  # is ever disabled for code we own.
  #
  # SINGLE SOURCE OF TRUTH: every flag, include path, define, exclusion and
  # suppression lives in the `cppcheck` target of `JOS/Makefile`, derived from
  # the same $(INCLUDES)/$(C_DEFS) the compiler uses. This workflow only calls
  # `make`, so the gate cannot drift from the real build. Run
  # `make -C JOS cppcheck-print` to see the exact command.
  # ---------------------------------------------------------------------------
  static-analysis:
    # The runner image is PINNED (deliberately not `ubuntu-latest`): the
    # cppcheck finding set is version dependent, so an image refresh must not be
    # able to change the gate result behind our backs.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned cppcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          # PINNED UPSTREAM VERSION: cppcheck 2.13.0, which is what
          # CPPCHECK_VERSION in JOS/Makefile requires (the `cppcheck` target
          # refuses to run anything else). Pinning matters because a cppcheck
          # bump can add, drop or retune checks (e.g. `constParameter` was
          # split into `constParameterPointer` in 2.11+) and would silently
          # change what this gate accepts.
          #
          # Three ways to get it, tried in order, so that a single archive
          # change cannot hard-block every PR. All three land on upstream
          # 2.13.0, so the Makefile's version assertion holds either way; if
          # all three fail, the job fails loudly with instructions rather than
          # quietly analysing with the wrong version.
          #
          #   1. the exact Ubuntu 24.04 (noble/universe) package revision;
          #   2. any Debian revision of the same upstream 2.13.0 (covers a
          #      security/rebuild bump such as -2ubuntu3.1 or -2ubuntu4);
          #   3. a source build of upstream tag 2.13.0 (slow, ~2 min, but
          #      immune to the archive entirely).
          #
          # To move to a different cppcheck: change PINNED_DEB/PINNED_VERSION
          # here AND CPPCHECK_VERSION in JOS/Makefile in the same PR, after
          # re-running the gate and triaging every new finding.
          PINNED_DEB=2.13.0-2ubuntu3
          PINNED_VERSION=2.13.0
          if sudo apt-get install -y --no-install-recommends "cppcheck=${PINNED_DEB}"; then
            echo "installed cppcheck=${PINNED_DEB} from apt (pinned revision)"
          elif sudo apt-get install -y --no-install-recommends "cppcheck=${PINNED_VERSION}*"; then
            echo "::warning::cppcheck=${PINNED_DEB} is gone from the archive; used another revision of upstream ${PINNED_VERSION}."
          else
            echo "::warning::apt has no cppcheck ${PINNED_VERSION}; building it from source."
            sudo apt-get install -y --no-install-recommends build-essential git libpcre3-dev
            git clone --depth 1 --branch "${PINNED_VERSION}" https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
            make -C /tmp/cppcheck-src -j"$(nproc)" MATCHCOMPILER=no HAVE_RULES=no FILESDIR=/usr/share/cppcheck
            sudo make -C /tmp/cppcheck-src install FILESDIR=/usr/share/cppcheck
          fi
          cppcheck --version
          # Hard assertion: whatever path we took must produce the pinned
          # upstream version, otherwise the gate result is not comparable with
          # the one this PR was reviewed against.
          cppcheck --version | grep -qE "(^|[^0-9.])${PINNED_VERSION}([^0-9.]|$)" || {
            echo "ERROR: expected cppcheck ${PINNED_VERSION}, got: $(cppcheck --version)"
            exit 1
          }

      # Canary: proves the gate is still capable of failing BEFORE we trust a
      # green result on the real tree. It generates a throwaway C file with an
      # out-of-bounds array write and a NULL dereference, runs cppcheck over it
      # with the EXACT same flags as the real gate, deletes the file, and fails
      # unless cppcheck both exits non-zero AND names `[arrayIndexOutOfBounds]`
      # and `[nullPointer]` -- matched in the bracketed `[{id}]` form cppcheck
      # stamps on a report line, under a pinned --template, so the assertion
      # cannot be satisfied by an echo of the canary's own source text. Exit
      # status alone would also be satisfied by an analyser that is merely
      # broken and noisy.
      #
      # This is not theoretical: the first version of this gate suppressed
      # `preprocessorErrorDirective` and never defined `__GNUC__`, so
      # cmsis_compiler.h hit `#error Unknown compiler`, cppcheck abandoned the
      # configuration without analysing anything and exited 0 on every run. The
      # canary #includes main.h and FreeRTOS.h, so it walks the same
      # HAL/CMSIS/FreeRTOS-portable include chain and reproduces that failure
      # mode -- it is verified to go red under the old flags.
      - name: Canary (assert the cppcheck gate can fail)
        run: make -C JOS cppcheck-canary

      # Include resolution, asserted rather than suppressed. `missingInclude`
      # is not suppressed anywhere in JOS/Makefile: a first-party header that
      # cppcheck cannot find means that translation unit was analysed against
      # an incomplete view of the code, so a clean gate result for it is
      # meaningless. This step makes that state fail loudly instead of hiding
      # behind a repo-wide suppression.
      - name: Include resolution (no unresolved first-party header)
        run: make -C JOS cppcheck-includes

      - name: Static analysis (cppcheck, first-party only)
        run: make -C JOS cppcheck

  build:
    name: Firmware build (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Align the toolchain with STMCubeIDE 2.x (Arm GNU Toolchain 14.3.Rel1),
      # the reference toolchain for STM32 firmware. This makes CI the authoritative
      # strong-verification gate so the local NixOS container is no longer required.
      - name: Install ARM GCC toolchain 14.3.Rel1
        run: |
          URL="https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"
          curl -sSL "$URL" -o /tmp/arm-toolchain.tar.xz
          sudo mkdir -p /opt/arm-gnu-toolchain-14.3.rel1
          sudo tar -xJf /tmp/arm-toolchain.tar.xz -C /opt/arm-gnu-toolchain-14.3.rel1 --strip-components=1
          echo "/opt/arm-gnu-toolchain-14.3.rel1/bin" >> "$GITHUB_PATH"

      - name: Build firmware
        working-directory: JOS
        run: make all

      - name: Stamp firmware image CRC
        working-directory: JOS
        run: make crc-stamp

      - name: Report size
        working-directory: JOS
        run: arm-none-eabi-size build/JOS.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jos-firmware
          path: |
            JOS/build/JOS.elf
            JOS/build/JOS.hex
            JOS/build/JOS.bin
          if-no-files-found: error

  unit-tests:
    name: Host unit tests (Ceedling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # Unity and CMock are taken from the Ceedling gem. There is deliberately
      # no vendored Unity in the repository, so there is exactly one version in
      # the build (see JOS/test/project.yml, :which_ceedling: gem).
      - name: Install Ceedling
        run: gem install ceedling -v 1.0.1 --no-document

      # gcovr is what actually computes the coverage numbers behind
      # `ceedling gcov:all`. Without it installed the plugin degrades to a
      # console summary that cannot fail, so this is a hard install step and
      # the version is echoed into the log.
      - name: Install gcovr
        run: |
          pipx install gcovr || python3 -m pip install --user gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show coverage tool versions
        run: |
          gcovr --version
          gcov --version | head -1

      - name: Run unit tests
        working-directory: JOS/test
        run: ceedling test:all

      # Enforced gate: JOS/test/project.yml sets :fail_under_line /
      # :fail_under_branch together with :exception_on_fail, so this step exits
      # non-zero when coverage of the modules under test drops below the
      # thresholds (verified locally: 99% threshold -> exit 1).
      - name: Enforce code coverage thresholds
        working-directory: JOS/test
        run: ceedling gcov:all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: JOS/test/build/test/results/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: JOS/test/build/artifacts/gcov/
          if-no-files-found: warn
