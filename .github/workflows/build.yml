name: Build JOS firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Build firmware
        working-directory: JOS
        run: make all

      - name: Report size
        working-directory: JOS
        run: arm-none-eabi-size build/JOS.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jos-firmware
          path: |
            JOS/build/JOS.elf
            JOS/build/JOS.hex
            JOS/build/JOS.bin
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ceedling
        run: gem install ceedling

      - name: Run unit tests (Ceedling)
        working-directory: JOS/test
        run: ceedling test:all
